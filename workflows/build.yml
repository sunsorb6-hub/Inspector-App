name: Build Inspector Portable

on:
  push:
    branches:
      - main # S'active automatiquement à chaque changement poussé sur la branche main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Récupération du code
      uses: actions/checkout@v4

    - name: Installation de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installation des outils
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller psutil

    - name: Compilation en Exécutable
      run: |
        pyinstaller --onefile --name="Inspector" --uac-admin main.py

    - name: Téléverser l'exécutable sur GitHub
      uses: actions/upload-artifact@v4
      with:
        name: Inspector-Windows
        path: dist/Inspector.exe
